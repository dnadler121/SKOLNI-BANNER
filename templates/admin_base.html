<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Správa banneru</title>
<style>
body{font-family:system-ui,sans-serif;background:#eef2f0;margin:0;color:#17342a}.wrap{max-width:900px;margin:40px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #0001}h1,h2{color:#176b3a}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b8c8c0;border-radius:10px;margin:6px 0 12px;font-size:16px}button,.btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:#176b3a;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.danger{background:#9b2c2c}.muted{color:#60736a}.status{font-weight:800}.ok{color:#18703d}.bad{color:#a43a3a}.flash{padding:12px 16px;border-radius:10px;background:#fff3cd;margin:12px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body><div class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</div></body></html>
