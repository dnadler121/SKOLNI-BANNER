<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Vyber třídu</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="kiosk">
  <main class="screen">
    <div class="topbar">
      <a class="back" href="/">← ZPĚT</a>
      <h1>VYBER TŘÍDU</h1>
    </div>
    <div id="loading" class="loading">Načítám třídy ze Školy Online…</div>
    <div id="error" class="error hidden"></div>
    <div id="classes" class="classes-grid"></div>
  </main>
<script>
(async () => {
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const box = document.getElementById('classes');
  try {
    const r = await fetch('/api/classes', {cache: 'no-store'});
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'Nepodařilo se načíst třídy.');
    loading.classList.add('hidden');
    data.classes.forEach(c => {
      const a = document.createElement('a');
      a.className = 'class-card';
      a.textContent = c.name;
      a.href = '/rozvrh/' + encodeURIComponent(c.name);
      box.appendChild(a);
    });
  } catch (e) {
    loading.classList.add('hidden');
    error.textContent = e.message;
    error.classList.remove('hidden');
  }
})();
</script>
</body>
</html>
