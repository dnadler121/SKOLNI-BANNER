<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rozvrh {{ class_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><style>
body{background:#fff}.tt{padding:24px}.title{text-align:center;color:#27831c}.note{text-align:center;margin:8px}.grid{display:grid;grid-template-columns:80px repeat(9,minmax(105px,1fr));gap:4px;min-width:1100px}.head,.day{background:#7f9297;color:#fff;padding:8px;text-align:center}.day{display:flex;align-items:center;justify-content:center;font-weight:800}.cell{min-height:100px;border:1px solid #ddd;background:#fafafa;padding:5px;text-align:center}.lesson{background:#fff0e7;border:1px solid #e7c8b7;border-radius:5px;padding:5px;margin:2px}.lesson strong,.lesson span,.lesson small{display:block}.split{display:grid;gap:3px}.status{text-align:center;margin:12px;font-weight:700}.error{color:#b21d17}.controls{text-align:center;margin:10px}.controls button{margin:0 4px;padding:5px 9px}
</style></head><body><main class="tt"><a class="back" href="/rozvrhy">← ZPĚT</a><h1 class="title">ROZVRH – {{ class_name }}</h1><div class="note">v14: přímé čtení HTML KRO003, bez PDF a bez Playwrightu. Načítá se aktuální týden.</div><div class="controls"><button onclick="loadLive()">Načíst aktuální rozvrh</button><button onclick="loadTest()">Test parseru (prosinec)</button></div><div id="status" class="status">Načítám aktuální týden…</div><div style="overflow:auto"><div id="grid" class="grid"></div></div></main><script>
const periods=[['0','07:10-07:55'],['1','08:00-08:45'],['2','08:50-09:35'],['3','09:40-10:25'],['4','10:45-11:30'],['5','11:35-12:20'],['6','12:30-13:15'],['7','13:20-14:05'],['8','14:15-15:00']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function box(g){return `<div class="lesson"><strong>${esc(g.subject)}</strong><span>${esc(g.teacher)}</span><small>${esc(g.room)}</small></div>`}
function render(d,label){let h='<div></div>';periods.forEach(p=>h+=`<div class="head"><b>${p[0]}</b><br><small>${p[1]}</small></div>`);(d.days||[]).forEach(day=>{h+=`<div class="day">${esc(day.short)}<br>${esc(day.date)}</div>`;let m={};(day.lessons||[]).forEach(x=>m[x.period]=x);for(let p=0;p<=8;p++){let l=m[p];if(!l){h+='<div class="cell"></div>';continue}if(l.groups)h+=`<div class="cell split">${l.groups.map(box).join('')}</div>`;else h+=`<div class="cell">${box(l)}</div>`}});document.getElementById('grid').innerHTML=h;let s=document.getElementById('status');s.className='status';s.textContent=label+(d.holiday?' – prázdniny':'')}
function fail(e){let s=document.getElementById('status');s.className='status error';s.textContent=e.message||String(e)}
function fetchData(url,label){document.getElementById('status').className='status';document.getElementById('status').textContent='Načítám…';fetch(url).then(async r=>{let d=await r.json();if(!d.ok)throw Error(d.error);return d}).then(d=>render(d,label)).catch(fail)}
function loadLive(){fetchData('/api/timetable/{{ class_name }}','Aktuální týden ze Školy Online')}
function loadTest(){fetchData('/api/timetable-test/{{ class_name }}','Testovací prosincový HTML rozvrh')}
loadLive();
</script></body></html>
