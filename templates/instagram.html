<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Instagram – novinky školy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="kiosk instagram-screen instagram-live-screen">
  <header class="instagram-topbar">
    <a class="back" href="{{ url_for('index') }}">← ZPĚT</a>
    <h1>INSTAGRAM – NOVINKY ŠKOLY</h1>
  </header>

  <main class="instagram-live-stage" aria-label="Poslední příspěvky Instagramu školy">
    <div id="instagramStatus" class="instagram-status">Načítám posledních 40 příspěvků…</div>
    <div id="instagramPages" class="instagram-pages" aria-live="polite"></div>
    <div id="instagramPager" class="instagram-pager" aria-hidden="true"></div>
    <div class="instagram-blocker" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const pagesEl = document.getElementById('instagramPages');
      const pagerEl = document.getElementById('instagramPager');
      const statusEl = document.getElementById('instagramStatus');
      const perPage = 12;          // 3 × 4 velké fotografie na svislé obrazovce
      const changeEvery = 10000;  // 10 sekund
      let pageIndex = 0;
      let timer = null;
      let pollTimer = null;

      function build(items, updatedAt) {
        pagesEl.innerHTML = '';
        pagerEl.innerHTML = '';
        pageIndex = 0;
        const chunks = [];
        for (let i = 0; i < Math.min(items.length, 40); i += perPage) {
          chunks.push(items.slice(i, i + perPage));
        }
        if (!chunks.length) return false;

        chunks.forEach((chunk, idx) => {
          const page = document.createElement('section');
          page.className = 'instagram-live-page' + (idx === 0 ? ' is-active' : '');
          chunk.forEach(item => {
            const card = document.createElement('article');
            card.className = 'instagram-post-card';
            const img = document.createElement('img');
            img.src = '/static/' + item.image;
            img.alt = 'Příspěvek školy z ' + (item.date || 'Instagramu');
            img.draggable = false;
            card.appendChild(img);
            page.appendChild(card);
          });
          pagesEl.appendChild(page);

          const dot = document.createElement('span');
          if (idx === 0) dot.className = 'active';
          pagerEl.appendChild(dot);
        });

        statusEl.textContent = items.length < 40
          ? `Načteno ${items.length} příspěvků${updatedAt ? ' • ' + updatedAt : ''}`
          : `Posledních 40 příspěvků${updatedAt ? ' • aktualizováno ' + updatedAt : ''}`;
        statusEl.classList.add('instagram-status-small');

        if (timer) clearInterval(timer);
        if (chunks.length > 1) {
          timer = setInterval(() => {
            const pages = [...document.querySelectorAll('.instagram-live-page')];
            const dots = [...pagerEl.querySelectorAll('span')];
            pages[pageIndex].classList.remove('is-active');
            dots[pageIndex].classList.remove('active');
            pageIndex = (pageIndex + 1) % pages.length;
            pages[pageIndex].classList.add('is-active');
            dots[pageIndex].classList.add('active');
          }, changeEvery);
        }
        return true;
      }

      async function load() {
        try {
          const response = await fetch('/api/instagram', {cache: 'no-store'});
          const data = await response.json();
          if (data.items && data.items.length) {
            build(data.items, data.updated_at);
            if (!data.refreshing && pollTimer) {
              clearInterval(pollTimer);
              pollTimer = null;
            }
          } else if (data.refreshing) {
            statusEl.textContent = 'Stahuji posledních 40 příspěvků… při prvním spuštění to může chvíli trvat.';
          } else if (data.error) {
            statusEl.textContent = 'Instagram se nepodařilo načíst: ' + data.error;
          }
        } catch (err) {
          statusEl.textContent = 'Instagram se momentálně nepodařilo načíst.';
        }
      }

      load();
      pollTimer = setInterval(load, 3000);
    })();
  </script>
</body>
</html>
