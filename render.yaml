services:
  - type: web
    name: skolni-banner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: BANNER_ENCRYPTION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skolni-banner-db
          property: connectionString

databases:
  - name: skolni-banner-db
    plan: free
